config:
  model: gpt-4
  max_tokens: 3600
  temperature: 0.2

scenarios:
  - name: hello-world-smoke-suite
    prompt: |
      Create a minimal Robot Framework smoke suite in one .robot file.
      Use deterministic assertion and valid sections.
    expected_patterns:
      - '*** Settings ***'
      - '*** Test Cases ***'
      - 'Should Be Equal'
      - '[Tags]    smoke'
    forbidden_patterns:
      - '*** Setting ***'
      - 'assert '
      - 'pytest'
    tags:
      - basic-usage
      - smoke
    mock_response: |
      ```robotframework
      *** Settings ***
      Documentation    Minimal smoke suite

      *** Test Cases ***
      Hello World Smoke
          [Tags]    smoke
          ${actual}=    Set Variable    ok
          Should Be Equal    ${actual}    ok
      ```

  - name: api-test-suite-requestslibrary-auth-get-post
    prompt: |
      Create a RequestsLibrary suite for authenticated API tests.
      Include GET and POST checks and assert status plus JSON fields.
      Mention installation command for RequestsLibrary.
    expected_patterns:
      - 'pip install robotframework-requests'
      - 'Library    RequestsLibrary'
      - 'Create Session'
      - 'GET On Session'
      - 'POST On Session'
      - 'Should Be Equal As Integers'
    forbidden_patterns:
      - 'import requests'
      - 'curl '
      - 'token=hardcoded'
    tags:
      - requestslibrary
      - api
      - auth
      - basic-usage
    mock_response: |
      ```robotframework
      *** Settings ***
      Documentation    Install with: pip install robotframework-requests
      Library    RequestsLibrary

      *** Test Cases ***
      Get Profile
          Create Session    api    http://localhost:18080
          ${headers}=    Create Dictionary    Authorization=Bearer ${API_TOKEN}
          ${resp}=    GET On Session    api    /profile    headers=${headers}
          Should Be Equal As Integers    ${resp.status_code}    200
          Should Contain    ${resp.json()}[role]    user

      Create Order
          ${headers}=    Create Dictionary    Authorization=Bearer ${API_TOKEN}
          ${payload}=    Create Dictionary    sku=RF-001    quantity=2
          ${resp}=    POST On Session    api    /orders    json=${payload}    headers=${headers}
          Should Be Equal As Integers    ${resp.status_code}    201
          Should Be Equal    ${resp.json()}[status]    CREATED
      ```

  - name: resource-file-refactor-common-resource
    prompt: |
      Refactor duplicated suite setup steps into a resource file.
      Return tests/orders.robot and resources/common.resource.
    expected_patterns:
      - 'tests/orders.robot'
      - 'resources/common.resource'
      - 'Resource    ../resources/common.resource'
      - '*** Keywords ***'
    forbidden_patterns:
      - 'TODO'
      - 'FIXME'
      - 'repeat setup in each test'
    tags:
      - refactor
      - scalability
    mock_response: |
      `tests/orders.robot`
      ```robotframework
      *** Settings ***
      Library    RequestsLibrary
      Resource    ../resources/common.resource
      Suite Setup    Open API Session

      *** Test Cases ***
      Get Orders
          ${resp}=    GET On Session    api    /orders
          Should Be Equal As Integers    ${resp.status_code}    200
      ```

      `resources/common.resource`
      ```robotframework
      *** Keywords ***
      Open API Session
          Create Session    api    ${BASE_URL}
      ```

  - name: python-keyword-library-module-and-class-style
    prompt: |
      Create a custom Python keyword library output with both module style and class style examples.
      Include two keywords in each style.
      Return libraries/text_keywords.py and libraries/math_keywords.py.
    expected_patterns:
      - 'from robot.api.deco import keyword'
      - '@keyword("Normalize Text")'
      - '@keyword("Is Even Number")'
      - 'class MathKeywords'
      - '@keyword("Add Integers")'
      - '@keyword("Multiply Integers")'
    forbidden_patterns:
      - 'print('
      - 'input('
      - 'eval('
    tags:
      - python-library
      - advanced-feature
    mock_response: |
      `libraries/text_keywords.py`
      ```python
      from robot.api.deco import keyword

      @keyword("Normalize Text")
      def normalize_text(value: str) -> str:
          return " ".join(value.split()).strip().lower()

      @keyword("Is Even Number")
      def is_even_number(value: int) -> bool:
          return int(value) % 2 == 0
      ```

      `libraries/math_keywords.py`
      ```python
      from robot.api.deco import keyword

      class MathKeywords:
          @keyword("Add Integers")
          def add_integers(self, left: int, right: int) -> int:
              return int(left) + int(right)

          @keyword("Multiply Integers")
          def multiply_integers(self, left: int, right: int) -> int:
              return int(left) * int(right)
      ```

  - name: standard-library-usage-operatingsystem
    prompt: |
      Write a Robot Framework suite that checks an environment variable and verifies a file exists.
      Use OperatingSystem library keywords.
    expected_patterns:
      - 'Library    OperatingSystem'
      - 'Get Environment Variable'
      - 'File Should Exist'
      - 'Should Not Be Empty'
    forbidden_patterns:
      - 'os.environ'
      - 'pathlib'
      - 'bash -c'
    tags:
      - standard-library
      - operating-system
    mock_response: |
      ```robotframework
      *** Settings ***
      Library    OperatingSystem

      *** Test Cases ***
      Validate Runtime Prerequisites
          ${token}=    Get Environment Variable    API_TOKEN
          Should Not Be Empty    ${token}
          File Should Exist    ${CURDIR}/../variables/dev.py
      ```

  - name: scale-patterns-tags-variables-suite-setup
    prompt: |
      Create a scalable Robot Framework suite using tags, variables, suite setup and teardown,
      and a reusable resource file.
    expected_patterns:
      - '*** Variables ***'
      - 'Suite Setup'
      - 'Suite Teardown'
      - '[Tags]'
      - 'Resource'
    forbidden_patterns:
      - 'password='
      - 'secret='
      - 'Sleep    10'
    tags:
      - scalability
      - ralf
    mock_response: |
      ```robotframework
      *** Settings ***
      Library    RequestsLibrary
      Resource    ../resources/common.resource
      Suite Setup    Open API Session
      Suite Teardown    Close API Session

      *** Variables ***
      ${BASE_URL}    http://localhost:18080

      *** Test Cases ***
      Health Check
          [Tags]    smoke    api
          ${resp}=    GET On Session    api    /health
          Should Be Equal As Integers    ${resp.status_code}    200
      ```

  - name: browserlibrary-async-advanced-flow
    prompt: |
      Create a Browser library enterprise test that validates async response handling.
      Use bounded timeout-based flow and deterministic selectors.
    expected_patterns:
      - 'Library    Browser'
      - 'Promise To'
      - 'Wait For Response'
      - 'timeout='
    forbidden_patterns:
      - 'Sleep    10'
      - 'Library    SeleniumLibrary'
    tags:
      - browser
      - advanced-feature
      - async
    mock_response: |
      ```robotframework
      *** Settings ***
      Library    Browser

      *** Test Cases ***
      Browser Async Flow
          New Browser    chromium    headless=true
          New Context
          New Page    data:text/html,<button id='refresh'>Refresh</button>
          ${promise}=    Promise To    Wait For Response    matcher=**/api/status    timeout=5s
          Click    id=refresh
          Wait For    ${promise}
      ```
