config:
  model: gpt-4
  max_tokens: 3600
  temperature: 0.2

scenarios:
  - name: hello-world-smoke-suite
    prompt: |
      Create a minimal Robot Framework smoke suite in one .robot file.
      Use modern syntax, deterministic assertions, and valid sections.
    expected_patterns:
      - '*** Settings ***'
      - '*** Test Cases ***'
      - '[Tags]    smoke'
      - 'Should Be Equal'
    forbidden_patterns:
      - '*** Setting ***'
      - 'assert '
      - 'pytest'
    tags:
      - basic-usage
      - smoke
      - github-copilot
    mock_response: |
      ```robotframework
      *** Settings ***
      Documentation    Minimal smoke suite

      *** Test Cases ***
      Hello World Smoke
          [Tags]    smoke
          ${actual}=    Set Variable    hello world
          Should Be Equal    ${actual}    hello world
      ```

  - name: api-test-suite-requestslibrary-auth-get-post
    prompt: |
      Create an enterprise RequestsLibrary suite that validates auth, GET, and POST endpoints.
      Assert both HTTP status and JSON fields. Mention RequestsLibrary installation.
    expected_patterns:
      - 'pip install robotframework-requests'
      - 'Library    RequestsLibrary'
      - 'Create Session'
      - 'GET On Session'
      - 'POST On Session'
      - 'Authorization=Bearer ${API_TOKEN}'
      - 'Should Be Equal As Integers'
      - 'Should Contain'
    forbidden_patterns:
      - 'import requests'
      - 'curl '
      - 'Authorization=Bearer hardcoded-token'
    tags:
      - basic-usage
      - requestslibrary
      - api
      - auth
    mock_response: |
      ```robotframework
      *** Settings ***
      Documentation    Install with: pip install robotframework-requests
      Library    RequestsLibrary

      *** Variables ***
      ${BASE_URL}    http://localhost:18080

      *** Test Cases ***
      Get Profile
          Create Session    api    ${BASE_URL}
          ${headers}=    Create Dictionary    Authorization=Bearer ${API_TOKEN}
          ${resp}=    GET On Session    api    /profile    headers=${headers}
          Should Be Equal As Integers    ${resp.status_code}    200
          Should Contain    ${resp.json()}    role

      Create Order
          ${headers}=    Create Dictionary    Authorization=Bearer ${API_TOKEN}
          ${payload}=    Create Dictionary    sku=RF-001    quantity=2
          ${resp}=    POST On Session    api    /orders    json=${payload}    headers=${headers}
          Should Be Equal As Integers    ${resp.status_code}    201
          Should Be Equal    ${resp.json()}[status]    CREATED
      ```

  - name: resource-file-refactor-common-resource
    prompt: |
      Refactor duplicated setup and auth keywords into a reusable resource file.
      Return tests/orders.robot and resources/common.resource.
    expected_patterns:
      - 'tests/orders.robot'
      - 'resources/common.resource'
      - 'Resource    ../resources/common.resource'
      - '*** Keywords ***'
    forbidden_patterns:
      - 'TODO'
      - 'FIXME'
      - 'repeat setup in each test'
    tags:
      - scalability
      - refactor
    mock_response: |
      `tests/orders.robot`
      ```robotframework
      *** Settings ***
      Library    RequestsLibrary
      Resource    ../resources/common.resource
      Suite Setup    Open API Session

      *** Test Cases ***
      Get Orders
          ${resp}=    GET On Session    api    /orders
          Should Be Equal As Integers    ${resp.status_code}    200
      ```

      `resources/common.resource`
      ```robotframework
      *** Keywords ***
      Open API Session
          Create Session    api    ${BASE_URL}
      ```

  - name: python-keyword-library-module-and-class-style
    prompt: |
      Create a custom Python keyword library example with static keyword style and class-based keyword style.
      Include two keywords per style and return libraries/text_keywords.py and libraries/math_keywords.py.
    expected_patterns:
      - 'from robot.api.deco import keyword'
      - '@keyword("Normalize Text")'
      - '@keyword("Is Even Number")'
      - 'class MathKeywords'
      - '@keyword("Add Integers")'
      - '@keyword("Multiply Integers")'
    forbidden_patterns:
      - 'print('
      - 'input('
      - 'eval('
    tags:
      - advanced-feature
      - python-library
    mock_response: |
      `libraries/text_keywords.py`
      ```python
      from robot.api.deco import keyword

      @keyword("Normalize Text")
      def normalize_text(value: str) -> str:
          return " ".join(value.split()).strip().lower()

      @keyword("Is Even Number")
      def is_even_number(value: int) -> bool:
          return int(value) % 2 == 0
      ```

      `libraries/math_keywords.py`
      ```python
      from robot.api.deco import keyword

      class MathKeywords:
          @keyword("Add Integers")
          def add_integers(self, left: int, right: int) -> int:
              return int(left) + int(right)

          @keyword("Multiply Integers")
          def multiply_integers(self, left: int, right: int) -> int:
              return int(left) * int(right)
      ```

  - name: standard-library-usage-operatingsystem
    prompt: |
      Write a Robot Framework suite using OperatingSystem library to validate environment variables and file existence.
    expected_patterns:
      - 'Library    OperatingSystem'
      - 'Get Environment Variable'
      - 'File Should Exist'
      - 'Should Not Be Empty'
    forbidden_patterns:
      - 'os.environ'
      - 'pathlib'
      - 'bash -c'
    tags:
      - standard-library
      - operating-system
    mock_response: |
      ```robotframework
      *** Settings ***
      Library    OperatingSystem

      *** Test Cases ***
      Validate Runtime Prerequisites
          ${token}=    Get Environment Variable    API_TOKEN
          Should Not Be Empty    ${token}
          File Should Exist    ${CURDIR}/../variables/dev.py
      ```

  - name: scale-patterns-tags-variables-suite-setup
    prompt: |
      Create a scalable Robot Framework suite that demonstrates tagging strategy, variable management,
      reusable resources, and suite setup/teardown.
    expected_patterns:
      - '*** Variables ***'
      - 'Suite Setup'
      - 'Suite Teardown'
      - '[Tags]'
      - 'Resource'
      - 'Should Be Equal'
    forbidden_patterns:
      - 'password='
      - 'secret='
      - 'Sleep    10'
    tags:
      - scalability
      - ralf
    mock_response: |
      ```robotframework
      *** Settings ***
      Library    RequestsLibrary
      Resource    ../resources/common.resource
      Suite Setup    Open API Session
      Suite Teardown    Close API Session

      *** Variables ***
      ${BASE_URL}    http://localhost:18080

      *** Test Cases ***
      Health Check
          [Tags]    smoke    api    regression
          ${resp}=    GET On Session    api    /health
          Should Be Equal As Integers    ${resp.status_code}    200
          Should Be Equal    ${resp.json()}[status]    UP
      ```

  - name: harness-and-ralph-loop-quality-improvement
    prompt: |
      Document Microsoft Skills Harness execution and Ralph Loop usage for iterative quality improvement.
      Include first pass and ralph loop commands.
    expected_patterns:
      - 'pnpm harness robot-framework-py --mock --verbose'
      - 'pnpm harness robot-framework-py --ralph --mock --max-iterations 5 --threshold 85'
      - 'Generate'
      - 'Score'
      - 'Feedback'
      - 'Regenerate'
      - 'Repeat'
    forbidden_patterns:
      - 'manual only'
      - 'one-shot generation'
    tags:
      - advanced-feature
      - ralf
      - harness
    mock_response: |
      Run a first quality pass:
      `cd tests && pnpm harness robot-framework-py --mock --verbose`

      Then run Ralph Loop optimization:
      `pnpm harness robot-framework-py --ralph --mock --max-iterations 5 --threshold 85`

      Ralph Loop process: **Generate → Score → Feedback → Regenerate → Repeat**.
